<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>あなたに向いてる花の仕事診断</title>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8GR3Q3FF7Q"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-8GR3Q3FF7Q');
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- トップ -->
    <section id="start-screen" class="screen active">
        <div class="flower-icon">🌸</div>

        <h1>あなたに向いてる<br>花の仕事診断</h1>

        <p class="lead">
            15個の質問に答えるだけ！<br>
            あなたにぴったりの<br>
            「花の仕事」を診断します💐
        </p>

        <div class="type-preview">
            <span>🚚 配送</span>
            <span>💐 制作</span>
            <span>🎨 センス</span>
            <span>🔍 品質</span>
        </div>

        <button id="start-btn" class="main-btn">
            診断スタート！
        </button>

        <p class="small-text">所要時間：約2〜3分</p>
    </section>


    <!-- 質問 -->
    <section id="quiz-screen" class="screen">

        <div class="progress-area">
            <div class="progress-text">
                <span id="question-number">1</span> / 15
            </div>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>
        </div>

        <div class="question-card">

            <h2 id="question"></h2>

            <div id="answers"></div>

        </div>

    </section>


    <!-- 結果 -->
    <section id="result-screen" class="screen">

        <p class="result-label">あなたのタイプは…</p>

        <div id="result-icon" class="result-icon"></div>

        <h1 id="result-title"></h1>

        <p id="result-description"></p>

        <div class="job-box">
            <h3>こんな仕事が向いてるかも！</h3>
            <p id="result-job"></p>
        </div>

        <a id="job-link" href="#" class="main-btn">
            この仕事について見る
        </a>

        <button id="restart-btn" class="sub-btn">
            もう一度診断する
        </button>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
